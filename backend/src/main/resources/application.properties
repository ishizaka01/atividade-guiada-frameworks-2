# Define o nome da aplicação no contexto Spring Boot.
spring.application.name=backend
# Especifica o dialeto SQL utilizado pelo Hibernate.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Define a classe do driver JDBC para conexão com o PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver
# URL de conexão com o banco de dados PostgreSQL.
spring.datasource.url=jdbc:postgresql://localhost:5432/aulaintegracao
# Nome de usuário utilizado para se conectar ao banco de dados.
spring.datasource.username=postgres
# Senha utilizada para se conectar ao banco de dados.
spring.datasource.password=postgres
# Habilita a geração automática do esquema do banco de dados.
spring.jpa.generate-ddl=true
# Define a estratégia para o Hibernate atualizar o esquema do banco.
# "update" atualiza a estrutura sem apagar os dados existentes.
spring.jpa.hibernate.ddl-auto=update
# Habilita a exibição das queries SQL geradas pelo Hibernate no console.
spring.jpa.show-sql=true
# Define a porta em que a aplicação Spring Boot irá rodar.
server.port=8080